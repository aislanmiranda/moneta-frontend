server {
    listen 80;
    root /usr/share/nginx/html;

    # Service worker and manifest must never be cached, or clients get stuck on an old version.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # Receipts up to 10 MB (API limit) + multipart overhead.
        client_max_body_size 12m;
        proxy_pass http://backend:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (WebSocket upgrade).
    location /hubs/ {
        proxy_pass http://backend:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # SPA fallback for client-side routes (/rotinas, /modulos/...).
    location / {
        try_files $uri /index.html;
    }
}
