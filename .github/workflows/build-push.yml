# Build e push da imagem do frontend (nginx + estáticos) no Harbor (projeto "moneta").
# Desenho: AM-4 (documento "architecture", §1).
#
# - push na main / workflow_dispatch na main: build + push, tag = SHA completo do commit.
# - pull_request para a main / workflow_dispatch em outra branch: só build (sem login, sem push).
# - Sem tag "latest". Credenciais só via GitHub Secrets (HARBOR_USERNAME / HARBOR_PASSWORD).
name: build-push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-push-${{ github.ref }}
  # Builds da main nunca são cancelados; em PR/branch só o mais recente importa.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ${{ vars.HARBOR_REGISTRY || 'register.automaticenergy.com.br' }}
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no Harbor
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build e push moneta/frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          provenance: false
          tags: ${{ env.REGISTRY }}/moneta/frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Imagens (${PUBLISH_LABEL})"
            echo "- \`${REGISTRY}/moneta/frontend:${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PUBLISH_LABEL: ${{ env.PUBLISH == 'true' && 'publicadas no Harbor' || 'só build, sem push' }}
